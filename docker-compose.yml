services:
  postgres:
    image: postgres:16
    container_name: insuranceadvisor-postgres
    ports:
      - "5442:5432"
    environment:
      POSTGRES_DB: insuranceadvisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - insuranceadvisor_pgdata:/var/lib/postgresql/data

volumes:
  insuranceadvisor_pgdata:
